<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin:0;
      padding:0;
    }
    .padd{
      height: 50px;
      width: 50px;
      padding: 2px;
      margin : 5px;
      box-sizing: content-box;
    }
    #first{
      border: 5px solid;
      border-radius: 10px;
      background-color: aquamarine;
    }
    #second{
      border: 5px solid red;
      border-radius: 10px;
      background-color: blueviolet;
    }
</style>
</head>
<body>
  <div id="first" class="padd">first</div>
  <div id="second" class="padd">second</div>
</body>
</html>
