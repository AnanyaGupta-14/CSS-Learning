<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /*thiss id comment*/
       #heading{
        color:chocolate
       }

       #div_22{
        color:yellow
       }
       p{
        color:darkcyan
       }
       .special_heading{
        color:hotpink
       }

       #first, #second{
        color:coral
       }
    </style>
</head>
<body>
    <h1 style="color:red">This is the heading</h1>
    <hr>
    <div id="heading" style="color:blue" >Heading</div>
    <hr>
    <div id="div_22">Div</div><br>
    <p>Lorem ipsum dolor sit amet.</p><br>
    <h2 class="special_heading">Heading2</h2>
    <hr>

    <div id="first">First</div>
    <div id="second">Second</div>
</body>
</html>
